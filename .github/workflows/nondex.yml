name: NonDex Flaky Test Check

on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  nondex:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Build module (skip tests)
        run: |
          ./mvnw -B install -DskipTests \
            -pl dubbo-rpc/dubbo-rpc-dubbo -am

      - name: Run test WITHOUT NonDex (should pass)
        run: |
          ./mvnw -B -pl dubbo-rpc/dubbo-rpc-dubbo test \
            -Dtest=org.apache.dubbo.rpc.protocol.dubbo.status.ThreadPoolStatusCheckerTest#test \
            2>&1 | tee normal-run.log

      - name: Run test WITH NonDex (should fail)
        continue-on-error: true
        run: |
          ./mvnw -B -pl dubbo-rpc/dubbo-rpc-dubbo \
            edu.illinois:nondex-maven-plugin:2.2.1:nondex \
            -Dtest=org.apache.dubbo.rpc.protocol.dubbo.status.ThreadPoolStatusCheckerTest#test \
            -DnondexRuns=10 \
            2>&1 | tee nondex-run.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-build-logs
          path: |
            normal-run.log
            nondex-run.log
