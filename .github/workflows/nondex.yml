name: NonDex

on: [pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  nondex:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21
      - name: Run NonDex (single pass)
        run: |
          ./mvnw -B \
            edu.illinois:nondex-maven-plugin:2.2.1:nondex \
            -DfailIfNoTests=false -DnondexRuns=1
